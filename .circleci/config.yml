version: 2.1
parameters:
  TARGET_REF:
    type: string
    default: ""
  GDRIVE_PATH:
    type: string
    default: ""
  ENABLE_PR_COMMENT:
    type: boolean
    default: false
  ARTIFACT_PATH:
    type: string
    default: "index.html"

jobs:
  build:
    docker:
    - image: cimg/go:1.26.8@sha256:43f2fbef1551ce6c971782e58eabc99a103f113b2ae629b1f51e7174891354fb
    resource_class: large
    environment:
      TZ: /usr/share/zoneinfo/Asia/Tokyo
      SKICKA_VERSION: v0.0.0-20200616214010-3c2bc8074c50
      STACK_VERSION: 3.7.1
      STACK_SHA256: c9ba670e7efd3f3807528e60ad09667dd37eba3d941c7edf6ab09d938abc70a8
    steps:
    - checkout
    - run:
        name: Set up environments
        environment:
          TARGET_REF: << pipeline.parameters.TARGET_REF >>
        command: |
          # NotifyEmail is trusted code from protected upstream develop; PR files must not run with secrets.
          git fetch --no-tags --depth=1 https://github.com/falgon/roki-web.git develop
          if ! git show FETCH_HEAD:tools/circleci/NotifyEmail.hs > "$HOME/NotifyEmail.hs"; then
            echo "NotifyEmail.hs is missing from trusted develop" >&2
            exit 1
          fi
          chmod 700 "$HOME/NotifyEmail.hs"
          if [[ ! "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TARGET_REF must be a 40-character commit SHA" >&2
            exit 1
          fi
          git -c advice.detachedHead=false checkout --detach "$TARGET_REF"
          echo 'export GOPATH="$HOME/.go"' >> $BASH_ENV
          echo 'export PATH="$HOME/.local/bin:$HOME/.go/bin:$PATH"' >> $BASH_ENV
          echo "export ARTIFACTS_URL=\"https://output.circle-artifacts.com/output/job/$CIRCLE_WORKFLOW_JOB_ID/artifacts/$CIRCLE_NODE_INDEX/<< pipeline.parameters.ARTIFACT_PATH >>\"" >> $BASH_ENV
          echo 'export ARTIFACTS_GDRIVE_PATH="<< pipeline.parameters.GDRIVE_PATH >>"' >> $BASH_ENV
          source "$BASH_ENV"
    - run:
        name: Setup tools
        command: |
          set -o pipefail
          umask 077
          sudo apt-get -qq update && sudo apt-get install -qq -y --no-install-recommends jq nkf python3 build-essential libffi-dev libgmp-dev libtinfo-dev xz-utils zlib1g-dev
          mkdir -p "$HOME/.local/bin"
          stack_binary=$(mktemp)
          curl -fsSL "https://github.com/commercialhaskell/stack/releases/download/v${STACK_VERSION}/stack-${STACK_VERSION}-linux-x86_64-bin" -o "$stack_binary"
          echo "${STACK_SHA256}  ${stack_binary}" | sha256sum --check -
          install -m 0755 "$stack_binary" "$HOME/.local/bin/stack"
          rm -f "$stack_binary"
          "$HOME/.local/bin/stack" --version
          (cd "$HOME" && GOTOOLCHAIN=local go install "github.com/google/skicka@${SKICKA_VERSION}")
          rm -f "$HOME/.skicka.tokencache.json" "$HOME/.skicka.config"
          skicka init
          if [ -z "$SKICKA_TOKEN_CACHE_JSON" ]; then
            echo "SKICKA_TOKEN_CACHE_JSON is empty" >&2
            exit 1
          fi
          printf '%s' "$SKICKA_TOKEN_CACHE_JSON" | base64 --decode > "$HOME/.skicka.tokencache.json"
          jq -e . "$HOME/.skicka.tokencache.json" >/dev/null
          python3 - \<<'PY'
          from pathlib import Path
          import os

          config_path = Path.home() / ".skicka.config"
          config = config_path.read_text()
          for key, name, placeholder in (
              ("clientid", "GOOGLE_CLIENT_ID", ";clientid=YOUR_GOOGLE_APP_CLIENT_ID"),
              ("clientsecret", "GOOGLE_CLIENT_SECRET", ";clientsecret=YOUR_GOOGLE_APP_SECRET"),
          ):
              value = os.environ.get(name, "")
              if not value:
                  raise SystemExit(f"{name} is empty")
              if "\n" in value or "\r" in value:
                  raise SystemExit(f"{name} contains a newline")
              if placeholder not in config:
                  raise SystemExit(f"{placeholder!r} not found in .skicka.config")
              config = config.replace(placeholder, f"{key}={value}")
          config_path.write_text(config)
          PY
          chmod 600 "$HOME/.skicka.tokencache.json" "$HOME/.skicka.config"
    - run:
        name: Fetch artifact from Google Drive
        command: |
          skicka -no-browser-auth download -ignore-times "$ARTIFACTS_GDRIVE_PATH" docs.tar.xz
          tar xvf docs.tar.xz
          skicka -no-browser-auth rm "$ARTIFACTS_GDRIVE_PATH"
    - store_artifacts:
        path: ./docs/
        destination: .
    - when:
        condition: << pipeline.parameters.ENABLE_PR_COMMENT >>
        steps:
          - run:
              name: Add comment
              command: |
                echo "export PR_RESPONSE_TMP=$(mktemp)" >> $BASH_ENV
                source "$BASH_ENV"
                curl -s --location --request GET \
                  -H "Authorization: token $YBGH_TOKEN" \
                  "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls?head=$CIRCLE_PROJECT_USERNAME:$CIRCLE_BRANCH&state=open" > $PR_RESPONSE_TMP
                if [ -z "$(cat $PR_RESPONSE_TMP)" ]; then
                  echo "No PR found to update"
                else
                  readonly pr_comment_url=$(jq -r ".[]._links.comments.href" "$PR_RESPONSE_TMP")
                  readonly status_badge_endpoint='https://dl.circleci.com/status-badge'
                  function urlencode {
                    echo "$1" | nkf -WwMQ | sed 's/=$//g' | tr = % | tr -d '\n'
                  }
                  readonly encoded_user="$(urlencode "$CIRCLE_PROJECT_USERNAME")"
                  readonly encoded_repo="$(urlencode "$CIRCLE_PROJECT_REPONAME")"
                  readonly encoded_branch="$(urlencode "$CIRCLE_BRANCH")"
                  readonly badge="[![CircleCI]($status_badge_endpoint/img/gh/$encoded_user/$encoded_repo/tree/$encoded_branch.svg?style=svg)]($status_badge_endpoint/redirect/gh/$encoded_user/$encoded_repo/tree/$encoded_branch)"
                  readonly details="\r\n<hr /><details><summary>more info</summary><p><ul><li>:cloud: Storage $(skicka df | grep 'Free space')</li><li>:open_file_folder: $(skicka du ${ARTIFACTS_GDRIVE_PATH%/*} | sed 's/^[ \t]*//')</li></ul></p></details>"
                  readonly data='{"body":"*'" $badge\r\n"'* [Build log]('"$CIRCLE_BUILD_URL)\r\n"'* [Preview build]('"$ARTIFACTS_URL"') with this PR (<< pipeline.parameters.TARGET_REF >>)'"$details"'"}'
                  readonly post_result=$(curl -fsX POST \
                    -H "Authorization: token $YBGH_TOKEN" \
                    -H 'Content-Type:application/json' \
                    -d "$data" \
                    "$pr_comment_url")
                  echo "$post_result" | jq -r '.html_url'
                fi
    - run:
        name: Notify Email
        no_output_timeout: 20m
        command: |
          if << pipeline.parameters.ENABLE_PR_COMMENT >>; then
            if [ -z "$(cat $PR_RESPONSE_TMP)" ]; then
              echo "No PR found to update"
              circleci-agent step halt
            else
              readonly pr_url=$(jq -r ".[]._links.html.href" "$PR_RESPONSE_TMP")
            fi
          else
            readonly pr_url="none"
          fi
          # NotifyEmail.hs pins its resolver/packages and is run outside the PR checkout.
          (cd "$HOME" && "$HOME/NotifyEmail.hs" \
            --pr-url "$pr_url" \
            --artifacts-url "$ARTIFACTS_URL" \
            --from-email "$FROM_EMAIL" \
            --to-email "$TO_EMAIL")

workflows:
  version: 2.1
  workflow:
    jobs:
      - build
