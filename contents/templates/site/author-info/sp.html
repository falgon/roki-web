<div class="column">
<div class="card is-shadowless">
<div class="card-content card-content-padding">
<div class="container">
    <figure class="image blured-my-prof-figure">
        <picture>
            <source 
                type="image/webp" 
                class="blured-my-prof-webp" 
                srcset="$profile-srcset$" sizes="$profile-sizes$"
                style="margin-top: 0; max-width: 300px; height: auto;" />
            <img class="blured-my-prof" src="/images/avator/prof300x300.png" alt="Profile photo of $author-name$"
                width="300" height="300" style="margin-top: 0; max-width: 300px; height: auto;" />
        </picture>
    </figure>

    <div class="mb-5" style="width: 200px; margin: 0 auto; display: flex; align-items: stretch;">
        <p class="title mb-0" id="my_name">$author-name$</p>
        <ul class="is-unstyled social-links">
            <li class="mt-0 mr-1">
                <a class="social-icon-github" href="https://github.com/$author-github$" aria-label="GitHub">
                    <i class="fab fa-github fa-fw" aria-hidden="true"></i>
                </a>
            </li>
            <li class="mt-0 mr-1">
                <a class="social-icon-twitter" href="https://twitter.com/$author-twitter$" aria-label="X (Twitter)">
                    <i class="fab fa-x-twitter fa-fw" aria-hidden="true"></i>
                </a>
            </li>
            <li class="mt-0 mr-1">
                <a class="social-icon-zenn" href="https://zenn.dev/roki" aria-label="Zenn">
                <!-- TODO: out the settings -->
                    <i class="fas fa-wave-square fa-fw" aria-hidden="true"></i>
                </a>
            </li>
            <li class="mt-0 mr-1">
                <a class="social-icon-note" href="https://note.com/$author-note$/" aria-label="note">
                    <i class="fas fa-note-sticky fa-fw" aria-hidden="true"></i>
                </a>
            </li>
        </ul>
        <div class="is-clearfix"></div>
    </div>
    $partial("contents/templates/site/author-info/listed.html")$

</div>
</div>
</div>
</div>
